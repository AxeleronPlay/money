name: Collect STALCRAFT auction history

on:
  schedule:
    # Каждые 10 минут. GitHub может задерживать расписание под нагрузкой
    # (иногда на 5-10 минут) - для сбора истории цен это не критично.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
    # ^ позволяет запустить вручную кнопкой "Run workflow" на вкладке
    #   Actions - удобно, чтобы проверить, что всё настроено правильно,
    #   не дожидаясь ближайшего расписания.

permissions:
  contents: write
  # ^ нужно, чтобы workflow мог закоммитить обновлённый
  #   stalcraft_history.db обратно в репозиторий.

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          STALCRAFT_CLIENT_ID: ${{ secrets.STALCRAFT_CLIENT_ID }}
          STALCRAFT_CLIENT_SECRET: ${{ secrets.STALCRAFT_CLIENT_SECRET }}
          STALCRAFT_API_MODE: production
          STALCRAFT_REGION: EU
        run: python collector.py

      - name: Commit and push if changed
        run: |
          git config user.name "stalcraft-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stalcraft_history.db
          git diff --cached --quiet || git commit -m "Update auction sales data"
          git push
